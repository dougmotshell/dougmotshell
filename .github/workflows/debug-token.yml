name: Debug Token Scope

on:
  push:
    branches:
      - tck-0002-fix-trophy-workflow-token

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe full queryUserAll with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > q.json <<'EOF'
          {"query":"query userInfo($username: String!) { user(login: $username) { createdAt contributionsCollection { totalCommitContributions restrictedContributionsCount totalPullRequestReviewContributions } organizations(first: 1) { totalCount } followers(first: 1) { totalCount } openIssues: issues(states: OPEN) { totalCount } closedIssues: issues(states: CLOSED) { totalCount } pullRequests(first: 1) { totalCount } repositories(first: 50, ownerAffiliations: OWNER, orderBy: {direction: DESC, field: STARGAZERS}) { totalCount nodes { languages(first: 2, orderBy: {direction:DESC, field: SIZE}) { nodes { name } } stargazers { totalCount } createdAt } } } }","variables":{"username":"dougmotshell"}}
          EOF
          curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @q.json https://api.github.com/graphql > resp.json
          echo "=== first 1500 chars ==="
          head -c 1500 resp.json
          echo
          echo "=== errors field ==="
          python3 -c "import json;d=json.load(open('resp.json'));print(json.dumps(d.get('errors'),indent=2));print('user is null:', d.get('data',{}).get('user') is None)"
